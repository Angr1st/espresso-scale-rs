[package]
name = "espresso_scale_rs"
version = "0.1.0"
authors = ["Torben Clasen <torbenclasen@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
hx711 = "0.7.0"
embedded-hal = "1.0.0"
embedded-hal-compat = "0.13.0"
embedded-graphics = "0.8.2"
# rust-embedded-community/ssd1331's latest release still uses graphics-core 0.3.
# Our display module connects its framebuffer to embedded-graphics 0.8.
ssd1331 = { version = "0.3.0", default-features = false }
nb = "1.1.0"
critical-section = "1.2.0"

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
